name: Build and publish Qenna Writer

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: qenna-writer-package
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check upstream for updates
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git ls-remote https://github.com/Pedrovskigg/qenna-writer.git HEAD | awk '{print $1}')"
          if [[ -z "$commit" ]]; then
            echo "Não foi possível consultar o repositório original."
            exit 1
          fi

          git fetch origin gh-pages || true
          published="$(git show origin/gh-pages:UPSTREAM_COMMIT 2>/dev/null || true)"

          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [[ "$commit" == "$published" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma atualização upstream."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Nova versão encontrada."
          fi

      - name: Build package in Arch Linux
        if: steps.upstream.outputs.changed == 'true'
        env:
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.commit }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e UPSTREAM_COMMIT="$UPSTREAM_COMMIT" \
            -v "$GITHUB_WORKSPACE:/work" \
            archlinux:base-devel \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed \
                git cmake ninja qt6-base qt6-svg qt6-multimedia \
                qt6-speech qt6-tools python

              useradd --create-home builder
              mkdir -p /tmp/pkg /work/repo
              cp /work/PKGBUILD /tmp/pkg/
              chown -R builder:builder /tmp/pkg

              su builder -s /bin/bash -c \
                "cd /tmp/pkg && makepkg --nodeps --cleanbuild --noconfirm"

              cp /tmp/pkg/*.pkg.tar.zst /work/repo/
              cd /work/repo
              repo-add qenna-writer-arch.db.tar.gz ./*.pkg.tar.zst
              printf "%s\n" "$UPSTREAM_COMMIT" > UPSTREAM_COMMIT
              touch .nojekyll
            '

      - name: Publish repository on GitHub Pages
        if: steps.upstream.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./repo
          force_orphan: true
